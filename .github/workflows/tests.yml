name: tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  JSOC_EMAIL: ${{ vars.JSOC_EMAIL }}

# A new push to a pull request replaces the runs of the last one, so that
# they stop downloading from JSOC.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  download:
    # The images the tests open are downloaded from JSOC by this job alone,
    # which is the one that tests downloading them, and shared with every
    # other job, so that JSOC serves them once a run and not once a job.
    # The macOS runners cannot connect to jsoc1.stanford.edu, which serves
    # the files, although they can search jsoc.stanford.edu.
    runs-on: ubuntu-latest
    name: JSOC download, Python 3.13 tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e ".[test]"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: jsoc
          # The images as JSOC serves them, without the Level 1.5 images
          # prepared from them, which every job prepares for itself.
          path: |
            ~/.sdo/cache/SUM*
            !~/.sdo/cache/SUM*/**/*_lev15*.fits
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella

  build:
    needs: download
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        python-version: ["3.12", "3.13",]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          name: jsoc
          path: ~/.sdo/cache
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e ".[test]"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
