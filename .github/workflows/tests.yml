name: tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  JSOC_EMAIL: ${{ vars.JSOC_EMAIL }}

# A new push to a pull request replaces the runs of the last one, so that
# they stop downloading from JSOC.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  download:
    # The images the tests open are searched for and downloaded from JSOC by
    # this job alone, which is the one that tests searching and downloading,
    # and shared with every other job, with the results of the searches, so
    # that JSOC serves them once a run and not once a job. The macOS runners
    # cannot connect to jsoc1.stanford.edu, which serves the files, and the
    # searches of jsoc.stanford.edu time out now and then.
    runs-on: ubuntu-latest
    name: JSOC download, Python 3.13 tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e ".[test]"
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload the images
        uses: actions/upload-artifact@v7
        with:
          name: jsoc
          # The images as JSOC serves them, without the Level 1.5 images
          # prepared from them, which every job prepares for itself, and the
          # searches for them, which sdo caches by their arguments.
          path: |
            ~/.sdo/cache/SUM*
            !~/.sdo/cache/SUM*/**/*_lev15*.fits
            ~/.sdo/cache/sdo/aia/_data/_urls
            ~/.sdo/cache/sdo/hmi/_data/_search
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella

  build:
    needs: download
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        python-version: ["3.12", "3.13",]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the images
        uses: actions/download-artifact@v8
        with:
          name: jsoc
          path: ~/.sdo/cache
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e ".[test]"
      - name: Test with pytest
        # Everything these tests open from JSOC was shared by the download
        # job, so they refuse to contact it, and fail at once if they do.
        env:
          SDO_TEST_JSOC: "0"
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
